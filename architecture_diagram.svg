<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 880" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: bold; fill: #212529; }
      .mono-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #495057; font-size: 11.5px; }
      .box-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: bold; fill: #111827; font-size: 15.5px; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: bold; fill: #1f2937; font-size: 13.5px; }
      .badge-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #334155; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ========================================================================= -->
  <!-- LAYER 1: USER INTERFACE LAYER -->
  <!-- ========================================================================= -->
  <rect x="75" y="30" width="800" height="155" rx="8" ry="8" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="95" y="55" class="title-text" font-size="13">1. User Interface Layer (Executables)</text>

  <!-- CLI Frontend Box -->
  <rect x="105" y="72" width="320" height="92" rx="6" ry="6" fill="#eff6ff" stroke="#1e293b" stroke-width="2" />
  <text x="265" y="99" class="box-header" text-anchor="middle">CLI Frontend (<tspan class="mono-text">synth</tspan>)</text>
  <text x="265" y="122" class="desc-text" text-anchor="middle">Parses CLI args (<tspan class="mono-text">--freq</tspan>, <tspan class="mono-text">--wave</tspan>, etc.),</text>
  <text x="265" y="140" class="desc-text" text-anchor="middle">validates ranges, triggers audio rendering.</text>

  <!-- Interactive TUI Box -->
  <rect x="525" y="72" width="320" height="92" rx="6" ry="6" fill="#eff6ff" stroke="#1e293b" stroke-width="2" />
  <text x="685" y="99" class="box-header" text-anchor="middle">Interactive TUI (<tspan class="mono-text">synth-tui</tspan>)</text>
  <text x="685" y="122" class="desc-text" text-anchor="middle">FTXUI interactive GUI with real-time waveform canvas,</text>
  <text x="685" y="140" class="desc-text" text-anchor="middle">ADSR envelope graph, and parameter sliders.</text>

  <!-- UI Convergence Bus Bar -->
  <path d="M 265 164 L 265 222 L 685 222 L 685 164" fill="none" stroke="#1e293b" stroke-width="2.2" />
  <!-- UI Bus Drop into Configuration / Settings at x = 380 -->
  <line x1="380" y1="222" x2="380" y2="305" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- ========================================================================= -->
  <!-- LAYER 2: CORE SYNTHESIZER ENGINE -->
  <!-- ========================================================================= -->
  <rect x="75" y="250" width="800" height="350" rx="8" ry="8" fill="#f1f5f9" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="95" y="278" class="title-text" font-size="13">2. Core Synthesizer Engine</text>
  <text x="95" y="296" class="mono-text" fill="#4b5563">(synth_core Static Library)</text>

  <!-- Configuration / Settings -->
  <rect x="105" y="308" width="310" height="90" rx="6" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="260" y="337" class="box-header" text-anchor="middle">Configuration / Settings</text>
  <text x="260" y="360" class="desc-text" text-anchor="middle"><tspan class="mono-text">SynthSettings</tspan> struct &amp; <tspan class="mono-text">Waveform</tspan> enum</text>
  <text x="260" y="378" class="desc-text" text-anchor="middle">Frequency, duration, sample rate, ADSR.</text>

  <!-- Rendering Pipeline -->
  <rect x="525" y="308" width="320" height="90" rx="6" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="685" y="337" class="box-header" text-anchor="middle">Rendering Pipeline (<tspan class="mono-text">render</tspan>)</text>
  <text x="685" y="360" class="desc-text" text-anchor="middle">Computes output audio sample buffer:</text>
  <text x="685" y="380" font-family="'Times New Roman', serif" font-style="italic" font-size="13.5" fill="#1e293b" text-anchor="middle">sample[i] = osc &middot; env &middot; amp</text>

  <!-- Settings -> Pipeline Arrow -->
  <line x1="415" y1="353" x2="522" y2="353" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- DSP Core Subsystem Container -->
  <rect x="105" y="445" width="740" height="125" rx="6" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="475" y="474" class="box-header" text-anchor="middle">DSP Core Sound Generation Subsystems (<tspan class="mono-text">synth_core</tspan>)</text>
  
  <line x1="475" y1="492" x2="475" y2="556" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Left: Oscillator Hierarchy -->
  <text x="290" y="508" class="box-sub" text-anchor="middle">Oscillator Hierarchy</text>
  <text x="290" y="532" class="desc-text" text-anchor="middle">Sine, Square, Sawtooth periodic generators</text>

  <!-- Right: ADSR Envelope Generator -->
  <text x="660" y="508" class="box-sub" text-anchor="middle">ADSR Envelope Generator</text>
  <text x="660" y="532" class="desc-text" text-anchor="middle">4-Stage piecewise linear modulator</text>

  <!-- Pipeline -> DSP Core Arrow -->
  <line x1="685" y1="398" x2="685" y2="442" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- DSP Core -> WavWriter (Buffer Pipe) at x = 420 -->
  <line x1="420" y1="570" x2="420" y2="708" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- Buffer Badge -->
  <rect x="315" y="625" width="210" height="26" rx="4" ry="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text x="420" y="642" class="badge-text" text-anchor="middle">Buffer: std::vector&lt;double&gt;</text>

  <!-- ========================================================================= -->
  <!-- LAYER 3: STORAGE AND OUTPUT LAYER -->
  <!-- ========================================================================= -->
  <rect x="75" y="660" width="800" height="170" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="95" y="688" class="title-text" font-size="13">3. Storage and Output Layer</text>
  <text x="95" y="706" class="mono-text" fill="#4b5563">(RIFF/WAVE Audio File)</text>

  <!-- WAV Serializer Box -->
  <rect x="135" y="712" width="365" height="100" rx="6" ry="6" fill="#dcfce7" stroke="#1e293b" stroke-width="2" />
  <text x="317" y="743" class="box-header" text-anchor="middle">WAV Serializer (<tspan class="mono-text">WavWriter</tspan>)</text>
  <text x="317" y="768" class="desc-text" text-anchor="middle">16-bit PCM quantization, Little-Endian bit encoding,</text>
  <text x="317" y="787" class="desc-text" text-anchor="middle">44-byte standard RIFF/WAVE header assembly.</text>

  <!-- Output File Box -->
  <rect x="615" y="712" width="230" height="100" rx="6" ry="6" fill="#bbf7d0" stroke="#166534" stroke-width="2" />
  <text x="730" y="743" class="box-header" text-anchor="middle">Output File</text>
  <text x="730" y="768" class="mono-text" font-weight="bold" font-size="14" fill="#14532d" text-anchor="middle">tone.wav</text>
  <text x="730" y="789" class="desc-text" text-anchor="middle">(Standard 16-bit PCM)</text>

  <!-- Serializer -> File Arrow -->
  <line x1="500" y1="762" x2="612" y2="762" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="557" y="753" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">Binary Stream</text>

</svg>
